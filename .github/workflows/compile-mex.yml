name: Compile MEX files

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.cpp'
      - '**/*.hpp'

jobs:
  compile-mex:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        release: ['R2021a', 'R2021b', 'R2022a', 'R2022b', 'R2023a', 'R2023b', 'R2024a', 'R2024b', 'R2025a', 'R2025b', 'R2026a']
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Setup MATLAB
      uses: matlab-actions/setup-matlab@v3
      with:
        release: ${{ matrix.release }}
    
    - name: Compile MEX files
      run: |
        make clean || true
        make
      shell: bash
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mex-files-${{ matrix.os }}-${{ matrix.release }}
        path: |
          *.mex*
        if-no-files-found: warn
