name: Compile MEX files

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  compile-mex:
    strategy:
      fail-fast: false
      matrix:
        # Add MATLAB versions as needed
        # matlab-version: ['R2023b', 'R2024b', 'R2025b']
        # os: [ubuntu-latest, windows-latest, macos-latest]
        matlab-version: ['R2024b']
        os: [ubuntu-latest]  
        # Exclude combinations that don't work
        exclude:
          - os: macos-latest
            matlab-version: R2023b
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MATLAB
      uses: matlab-actions/setup-matlab@v2
      with:
        release: ${{ matrix.matlab-version }}
    
    - name: Verify MATLAB installation
      run: |
        matlab -batch "disp('MATLAB version:'); version; disp('MEX configured for:'); mex -setup"
      shell: bash
    
    - name: Compile MEX file with Makefile
      run: |
        # Clean previous builds
        make clean || true
        
        # Build MEX file
        make
      shell: bash
    
    - name: List compiled files
      run: |
        echo "Compiled MEX files:"
        find . -name "*.mex*" -type f
      shell: bash
    
    - name: Test MEX files (optional)
      run: |
        # Replace 'your_mex_function' with your actual MEX function name
        matlab -batch "try; disp('Testing MEX file...'); your_mex_function; catch ME; disp(ME.message); exit(1); end; exit(0);"
      shell: bash
      continue-on-error: true
    
    - name: Upload MEX artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mex-files-${{ matrix.os }}-${{ matrix.matlab-version }}
        path: |
          *.mex*
        if-no-files-found: warn
