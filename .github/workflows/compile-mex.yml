name: Compile MEX files

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.cpp'
      - '**/*.hpp'

jobs:
  compile-mex:
    strategy:
      fail-fast: false
      matrix:
        # Add MATLAB versions as needed
        # matlab-version: ['R2023b', 'R2024b', 'R2025b']
        # os: [ubuntu-latest, windows-latest, macos-latest]
        matlab-version: ['R2024b']
        os: [ubuntu-latest]  
        # Exclude combinations that don't work
        exclude:
          - os: macos-latest
            matlab-version: R2023b
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout FieldTrip
      uses: actions/checkout@v6
    
    - name: Setup MATLAB
      uses: matlab-actions/setup-matlab@v3
      with:
        release: ${{ matrix.matlab-version }}
    
    - name: Compile MEX files
      run: |
        make clean || true
        make
      shell: bash
    
    - name: Upload MEX artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mex-files-${{ matrix.os }}-${{ matrix.matlab-version }}
        path: |
          *.mex*
        if-no-files-found: warn
