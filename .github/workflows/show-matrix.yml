name: Show matrix

on:
  workflow_dispatch:

jobs:
  show-details:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-13, macos-14, macos-15, macos-15-intel, macos-26, windows-2019, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
        - name: Show matrix details
          run: |
            echo "OS: ${{ matrix.os }}"
            uname -a
          shell: bash